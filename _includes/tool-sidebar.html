<aside class="tool-rail" aria-label="工具导航">

  <p class="tool-rail__title">
    工具箱<span class="tool-rail__en">toolkit</span>
  </p>

  <nav class="tool-rail__nav">
    <ol>
      {% for item in site.data.tool-sidebar %}
      <li>
        <a href="{{ item.link | prepend: site.baseurl }}"
          class="tool-rail__link{% if page.url == item.link %} active{% endif %}"
          {% if page.url == item.link %}aria-current="page"{% endif %}>
          <span class="tool-rail__name">{{ item.name }}</span>
        </a>
      </li>
      {% endfor %}
    </ol>
  </nav>

</aside>
